[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wireshark-mcp"
version = "0.1.0"
description = "Wireshark & PCAP Threat Triage MCP Server for Security Engineers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "scapy>=2.5.0",
    "pydantic>=2.0.0",
]

[project.scripts]
wireshark-mcp = "wireshark_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wireshark_mcp*"]
